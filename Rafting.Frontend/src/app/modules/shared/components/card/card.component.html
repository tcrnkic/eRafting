<section class="card">
  <header class="card-head">
    <div class="card-text">
      <h2 class="card-title">{{ title() }}</h2>
      @if (description()) {
        <p class="card-description">{{ description() }}</p>
      }
    </div>
    <div class="card-actions">
      <ng-content select="[cardActions]" />
    </div>
  </header>

  <div class="card-body">
    <ng-content />
  </div>
</section>
