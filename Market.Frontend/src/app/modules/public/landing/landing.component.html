<div class="landing-page">
  <section class="hero-section">
    <div class="hero-content">
      <div class="hero-text">
        <div class="logo-container">
          <mat-icon class="logo-icon">kayaking</mat-icon>
          <h1 class="brand-name">eRafting</h1>
        </div>
        <h2 class="hero-title">{{ 'LANDING.HERO_TITLE' | translate }}</h2>
        <p class="hero-description">{{ 'LANDING.HERO_DESCRIPTION' | translate }}</p>
        <div class="hero-actions">
          @if (!currentUser.isAuthenticated()) {
            <a mat-raised-button color="primary" routerLink="/auth/login">
              <mat-icon>login</mat-icon>
              {{ 'PUBLIC.NAV.LOGIN' | translate }}
            </a>
          }
        </div>
      </div>
    </div>
  </section>
</div>
